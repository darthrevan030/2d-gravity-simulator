name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    env:
      CXX: g++-15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15 cmake ninja-build

      - name: Configure
        run: cmake --preset default

      # Warnings do not fail the build, but the statement allows none
      - name: Build
        run: |
          cmake --build --preset ${{ matrix.config }} 2>&1 | tee build.log
          if grep -q 'warning:' build.log; then
            echo '::error::compiler warnings found'
            grep 'warning:' build.log
            exit 1
          fi

      - name: Test
        run: ctest --preset ${{ matrix.config }} --output-on-failure

      # The real executables against the instructor's references, including the 10K case
      - name: Functional tests
        if: matrix.config == 'release'
        run: scripts/ftest.sh --no-build --full
