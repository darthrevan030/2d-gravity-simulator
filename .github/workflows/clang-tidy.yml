name: Clang-Tidy

on:
  pull_request:

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04
    env:
      CXX: g++-15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15 cmake ninja-build clang-tidy-22

      # The clang-tidy preset sets ENABLE_CLANG_TIDY, so tidy runs during the build
      - name: Configure
        run: cmake --preset clang-tidy

      - name: Build with clang-tidy
        run: cmake --build --preset clang-tidy-debug
